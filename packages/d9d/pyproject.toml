[project]
name = "d9d"
version = "0.24.0"
description = "d9d - d[istribute]d - distributed training framework based on PyTorch that tries to be efficient yet hackable"
authors = [
    {name = "Maksim Afanasyev", email = "mr.applexz@gmail.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",

]
dependencies = [
    "pydantic>=2.0.0",
    "torchdata>=0.11.0",
    "safetensors>=0.7.0",
    "tqdm>=4.0.0",
    "triton>=3.6.0",
    "torch>=2.14.0",
    "d9d-kernels==0.24.0",
    "optree>=0.19.0",
]

[project.optional-dependencies]
tracker-aim = [
    "aim>=3.0.0,<4.0.0",  # Aim tracker integration
    "setuptools>=70.0.0",  # Unset dependency for Aim
]
tracker-wandb = [
    "wandb>=0.25.0",  # W&B tracker integration
]
tracker-tensorboard = [
    "tensorboard>=2.20.0",  # TensorBoard tracker integration
]
tracker-mlflow = [
    "mlflow-skinny>=3.0.0",  # MLflow tracker integration
]
visualization = [
    "plotly>=6.0.0",  # For visualizing LR schedulers
]
cce = [
    "cut-cross-entropy>=25.9.3",  # For efficient CE, https://github.com/apple/ml-cross-entropy
]
linear-attention = [
    "fla-core>=0.4.2",  # For efficient linear attention, https://github.com/fla-org/flash-linear-attention
]
backend-sdpa-flash-attention-2 = [
    "flash-attn>=2.0.0",  # SDPA Backend, https://github.com/Dao-AILab/flash-attention
]
backend-sdpa-flash-attention-4 = [
    "flash-attn-4>=4.0.0b32",  # SDPA Backend, https://github.com/Dao-AILab/flash-attention
]
backend-grouped-mm-quack = [
    "quack-kernels>=0.6.5",  # Grouped GEMM Backend, https://github.com/Dao-AILab/quack
]
backend-grouped-mm-grouped-gemm = [
    "nv-grouped-gemm>=1.1.4",  # Grouped GEMM Backend, https://github.com/fanshiqing/grouped_gemm/
]
backend-expert-parallel-deepep = [
    "deep-ep>=1.2.1",  # Expert Parallel Backend, https://github.com/deepseek-ai/DeepEP
]

[project.urls]
Repository = "https://github.com/d9d-project/d9d"
Documentation = "https://d9d-project.github.io/d9d"
Homepage = "https://d9d-project.github.io/d9d"
Issues = "https://github.com/d9d-project/d9d/issues"
"Discord Server" = "https://discord.gg/sNRjDbxVrg"


[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
