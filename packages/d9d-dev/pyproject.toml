[project]
name = "d9d-dev"
version = "0.0.0"
description = "Tests and benchmarks of d9d. Installed into the development environment, never published."
requires-python = ">=3.11,<3.15"
# PyPI rejects packages with this classifier, so the tests cannot be uploaded by mistake.
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "d9d",
    "pytest>=9.0.2,<10.0.0",
    "coverage>=7.13.1,<8.0.0",
    "pytest-instafail>=0.5.0,<0.6.0",
    "pandas>=3.0.0,<4.0.0",  # for triton benchmarks
    "matplotlib>=3.10.8,<4.0.0",  # for triton benchmarks
    "transformers>=5.5.0,<6.0.0",  # for comparing models
    "scikit-learn>=1.8.0,<2.0.0",  # for comparing metrics
    "liger-kernel>=0.7.0,<0.8.0",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
