[project]
name = "d9d-kernels"
version = "0.24.0"
description = "GPU kernels for training in PyTorch, from the d9d training framework"
authors = [
    {name = "Maksim Afanasev", email = "mr.applexz@gmail.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "torch>=2.14.0",
    "triton>=3.6.0",
]

[project.urls]
Repository = "https://github.com/d9d-project/d9d"
Homepage = "https://d9d-project.github.io/d9d"
Issues = "https://github.com/d9d-project/d9d/issues"
"Discord Server" = "https://discord.gg/sNRjDbxVrg"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
