mesh: {}

model: models/Qwen3-0.6B

data:
  dataset: Salesforce/wikitext
  dataset_config: wikitext-2-raw-v1
  split: validation
  text_column: text
  tokenizer: models/Qwen3-0.6B/tokenizer.json
  max_length: 512

auto_data:
  global_batch_size: 16
  microbatch_size: 16
  num_workers: 2
  shuffle: false
  drop_last: false

inference:
  determinism:
    base_seed: 42
  gc:
    period_steps: 50
  checkpointing:
    save_dir: runs/evaluate
    period_steps: disable
  timeout:
    init_timeout: 1800
    step_timeout: 300
