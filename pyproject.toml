[project]
name = "d9d"
version = "0.20.1"
description = "d9d - d[istribute]d - distributed training framework based on PyTorch that tries to be efficient yet hackable"
authors = [
    {name = "Maksim Afanasyev", email = "mr.applexz@gmail.com"}
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",

]
dependencies = [
    "pydantic>=2.0.0",
    "torchdata>=0.11.0",
    "safetensors>=0.7.0",
    "tqdm>=4.0.0",
    "triton>=3.6.0",
    "torch>=2.14.0",
    "optree>=0.19.0",
]

[project.optional-dependencies]
aim = [
    "aim>=3.0.0,<4.0.0",  # Aim tracker integration
    "setuptools>=70.0.0",  # Unset dependency for Aim
]
visualization = [
    "plotly>=6.0.0",  # For visualizing LR schedulers
]
moe = [
    "deep-ep>=1.2.1",  # For MoE, https://github.com/deepseek-ai/DeepEP
    "nv-grouped-gemm>=1.1.4",  # For MoE, https://github.com/fanshiqing/grouped_gemm/
]
cce = [
    "cut-cross-entropy>=25.9.3",  # For efficient CE, https://github.com/apple/ml-cross-entropy
]
linear-attention = [
    "fla-core>=0.4.2",  # For efficient linear attention, https://github.com/fla-org/flash-linear-attention
]
backend-sdpa-flash-attention-2 = [
    "flash-attn>=2.0.0",  # SDPA Backend, https://github.com/Dao-AILab/flash-attention
]
backend-sdpa-flash-attention-4 = [
    "flash-attn-4>=4.0.0b32",  # SDPA Backend, https://github.com/Dao-AILab/flash-attention
]

[project.urls]
Repository = "https://github.com/d9d-project/d9d"
Documentation = "https://d9d-project.github.io/d9d"
Homepage = "https://d9d-project.github.io/d9d"
Issues = "https://github.com/d9d-project/d9d/issues"
"Discord Server" = "https://discord.gg/sNRjDbxVrg"


[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"


[dependency-groups]
dev = [
    "ruff>=0.14.13,<0.15.0",
    "pre-commit>=4.5.1,<5.0.0",
    "python-semantic-release>=10.5.3,<11.0.0",
    "ty>=0.0.16,<0.0.17",
]
test = [
    "pytest>=9.0.2,<10.0.0",
    "coverage>=7.13.1,<8.0.0",
    "pytest-instafail>=0.5.0,<0.6.0",
    "pandas>=3.0.0,<4.0.0",  # for triton benchmarks
    "matplotlib>=3.10.8,<4.0.0",  # for triton benchmarks
    "transformers>=5.5.0,<6.0.0",  # for comparing models
    "scikit-learn>=1.8.0,<2.0.0",  # for comparing metrics
    "liger-kernel>=0.7.0,<0.8.0",
]
docs = [
    "zensical>=0.0.24,<0.0.25",
    "mkdocstrings-python>=2.0.3,<3.0.0",
]
examples = [
    "datasets>=4.5.0,<5.0.0",
]


[tool.uv]
default-groups = "all"

[tool.uv.sources]
# DeepEP is not published on PyPI: build it from a pinned commit against the exact torch/NVSHMEM from the lock
deep-ep = { git = "https://github.com/deepseek-ai/DeepEP", rev = "9af0e0d0e74f3577af1979c9b9e1ac2cad0104ee" }
# PyPI only has cut-cross-entropy 25.1.1; this commit is the 25.9.3 version bump
cut-cross-entropy = { git = "https://github.com/apple/ml-cross-entropy", rev = "b7a02791b234e187b524fb1dba6a812d521b203a" }
# flash-attn <= 2.8.3.post1 on PyPI hardcodes -std=c++17, while torch >= 2.13 headers require C++20; fixed upstream here
flash-attn = { git = "https://github.com/Dao-AILab/flash-attention", rev = "edb5c76ee329b18ed95d1f7ea9aa522a1331ab7d" }

[tool.uv.extra-build-dependencies]
deep-ep = [
    { requirement = "torch", match-runtime = true },
    { requirement = "nvidia-nvshmem-cu13", match-runtime = true },
    "ninja",
    "numpy"
]
nv-grouped-gemm = [
    { requirement = "torch", match-runtime = true },
    "ninja",
]
flash-attn = [
    { requirement = "torch", match-runtime = true },
    "ninja",
    "packaging",
    "psutil",
    "wheel",
]

[tool.uv.extra-build-variables]
# DeepEP 1.x compiles deep_ep.cpp with the host compiler, which does not see the CCCL headers moved to include/cccl in CUDA 13
deep-ep = { CPLUS_INCLUDE_PATH = "/usr/local/cuda/include/cccl" }
# Always compile against the locked torch instead of downloading a prebuilt wheel guessed from torch/CUDA/Python versions.
# Its setup.py hardcodes -std=c++17 for nvcc, but torch headers require C++20; nvcc keeps the last -std it sees.
# Its vendored CUTLASS has a typo (set_slice3x3) in an uninstantiated template, which GCC >= 14 rejects via -Wtemplate-body
nv-grouped-gemm = { GROUPED_GEMM_FORCE_BUILD = "TRUE", NVCC_APPEND_FLAGS = "-std=c++20 -Xcompiler -Wno-template-body" }
# Same prebuilt-wheel guessing as nv-grouped-gemm
flash-attn = { FLASH_ATTENTION_FORCE_BUILD = "TRUE" }

# Static metadata lets `uv lock` resolve CUDA extensions without compiling them
[[tool.uv.dependency-metadata]]
name = "deep-ep"
version = "1.2.1+9af0e0d"
requires-dist = []

[[tool.uv.dependency-metadata]]
name = "nv-grouped-gemm"
requires-dist = ["absl-py", "numpy", "torch"]

[[tool.uv.dependency-metadata]]
name = "flash-attn"
version = "2.8.4"
requires-dist = ["torch", "einops"]

[tool.uv.build-backend]
module-root = ""


[tool.pytest.ini_options]
markers = [
    "local: no torchrun",
    "distributed: run using torchrun",
]

[tool.ruff]
src = ["d9d"]
target-version = "py311"
include = [
    "d9d/**/*.py",
    "test/**/*.py",
    "benchmark/**/*.py",
    "example/**/*.py"
]
exclude = [
    "d9d/kernel/cce/**.py",
    "d9d/kernel/moe/**.py",
]
line-length = 120
indent-width = 4

[tool.ruff.lint]
preview = true
extend-select = [
    "YTT",
    "ANN",
    "ASYNC",
    "S",
    "BLE",
    "FBT003",
    "B",
    "A",
    "COM",
    "C4",
    "DTZ",
    "T10",
    "EXE",
    "FA",
    "INT",
    "ISC",
    "ICN",  # we may configure it later
    "LOG",
    "G",
    "INP",
    "PIE",
    "T20",
    "PYI",
    "PT",
    "Q",
    "RET",
    "SLF",
    "SIM",
    "SLOT",
    # "TD", # enable later
    "TC",
    "PTH",
    "FLY",
    "I",
    "C90",
    "N",
    "PERF102",
    "PERF203",
    "PERF402",
    "E",
    "W",
    "F",
    "PGH",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "UP",
    "FURB",
    "RUF",
    "TRY",
    "DOC",
    "D"
]
fixable = [
    "F401",
    "UP035",
    "I001",
    "E302",
    "E303",
    "Q000",
    "RUF022",
    "W292",
    "W293",
    "W391",
    "D202",
    "D212",
]
ignore = [
    "ANN401",  # Dynamically typed expressions (typing.Any) are disallowed in {name}
    "S311",  # Standard pseudo-random generators are not suitable for cryptographic purposes
    "COM812",  # we do not use trailing commas everywhere
    "C420",  # Unnecessary dict comprehension for iterable; use dict.fromkeys instead
    "C416",  # Unnecessary {kind} comprehension (rewrite using {kind}())
    "G004",  # Logging statement uses f-string
    "PIE808",  #  	Unnecessary start argument in range
    "PT011",  # pytest.raises({exception}) is too broad, set the match parameter or use a more specific exception
    "PT012",  # pytest.raises() block should contain a single simple statement
    "RET504",  # Unnecessary assignment to {name} before return statement
    "RET505",  # Unnecessary {branch} after return statement
    "SIM103",  # Return the condition {condition} directly
    "SIM108",  # Use ternary operator {contents} instead of if-else-bloc
    "TC003",  # Move standard library import `collections.abc.Iterator` into a type-checking block
    "TC002",  # Move third-party import {} into a type-checking block
    "TC001",  # Move own import into a type-checking block
    "PLR2004",  # Magic value used in comparison, consider replacing {value} with a constant variable
    "PLR6301",  # Method {method_name} could be a function, class method, or static method
    "PLR0904",  # Too many
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0914",
    "PLR0915",
    "PLR0916",
    "PLR0917",
    "PLR6104",  # Use {operator} to perform an augmented assignment directly
    "FURB118",  # Use operator.{operator} instead of defining a {target}
    "FURB140",  # Use itertools.starmap instead of the generator
    "TRY003",  # Avoid specifying long messages outside the exception class
    "TC006",  # Add quotes to type expression in typing.cast()
    "TRY004",  # Prefer TypeError exception for invalid type
    "PGH003",  # Use specific rule codes when ignoring {} issues
    "DOC502",  # Raised exception is not explicitly raised: {id}
    "D100",  # Missing docstring for public APIs (D100..D107)
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ruff.lint.per-file-ignores]
"d9d/kernel/*.py" = [
    "N803"  # for uppercase kernel arg names
]
"test/*.py" = [
    "S101", # asserts allowed in tests...
    "D", "DOC",  # no docs for tests sorry
    "ANN",  # no type annotations for tests
    "SLF001",  # private access is ok for tests
    "PLC0415",  # imports outside top level are OK for tests
    "FBT003",  # PyTorch APIs like requires_grad_() only accept positional bools
]
"example/*.py" = [
    "INP001"  # no __init__.py
]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = [
    "F",  # pytorch nn.functional :)
    "BLOCK_SIZE"  # triton kernels
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
exclude = [
    "test/**",
]

[tool.ty.rules]
# currently does not work properly with torch.distributed package (please see https://github.com/astral-sh/ty/issues/2244)
possibly-missing-attribute = "ignore"

[[tool.ty.overrides]]
include = [
    "d9d/kernel/cce/*",
    "d9d/kernel/moe/*",
    "d9d/module/block/moe/communications/deepep.py"
]
rules = { all = "ignore" }

# since triton 3.8, `JITFunction.__call__`/`ConstexprFunction.__call__` are typed with a `self: JITFunction[Callable[P, R]]`
# self-type that ty fails to match, so every call of a triton function inside a kernel is reported
[[tool.ty.overrides]]
include = ["d9d/kernel/**"]
rules = { invalid-argument-type = "ignore" }

[tool.semantic_release]
allow_zero_version = true
major_on_zero = true
version_toml = ["pyproject.toml:project.version"]
build_command = """
pip install uv
uv lock --upgrade-package d9d
git add uv.lock
uv build
"""
commit_parser = "conventional"

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
parse_squash_commits = true
ignore_merge_commits = true

[tool.semantic_release.changelog]
exclude_commit_patterns = [
    '''chore(?:\([^)]*?\))?: .+''',
    '''ci(?:\([^)]*?\))?: .+''',
    '''refactor(?:\([^)]*?\))?: .+''',
    '''style(?:\([^)]*?\))?: .+''',
    '''test(?:\([^)]*?\))?: .+''',
    '''build\((?!deps\): .+)''',
    '''Initial [Cc]ommit.*''',
]

[tool.semantic_release.remote]
type = "github"
