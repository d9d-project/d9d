[project]
site_name = "d9d"
site_description = "d9d is a composable framework for distributed training in PyTorch. You write the model in plain PyTorch, and d9d runs it on one GPU or on a multi-node cluster."
repo_url = "https://github.com/d9d-project/d9d"
copyright = """
Copyright &copy; 2026 The d9d Project
"""
docs_dir = "docs"
extra_javascript = [
    "docs/.infra/js/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js"
]

nav = [
    { "Home" = "index.md" },
    { "Getting Started" = [
        "getting_started/installation.md",
        "getting_started/quickstart.md",
    ] },
    { "Concepts" = [
        "concepts/how_d9d_works.md",
        "concepts/parallelism.md",
        "concepts/comparison.md",
    ] },
    { "Guides" = [
        "guides/write_your_own_job.md",
        "guides/running.md",
        "guides/finetune_huggingface.md",
        "guides/troubleshooting.md",
    ] },
    { "Table of Contents" = "toc.md" },
    { "Core" = [
        "core/dist_context.md",
        "core/dist_ops.md",
        "core/pytree.md",
        "core/types.md",
        "core/offload.md",
    ] },
    { "Training and Inference" = [
        "loop/train.md",
        "loop/inference.md",
        "loop/checkpointing.md",
        "loop/config.md",
        { "Interfaces" = [
            "loop/interfaces/index.md",
            "loop/interfaces/task.md",
            "loop/interfaces/model.md",
            "loop/interfaces/data.md",
            "loop/interfaces/events.md",
            "loop/interfaces/optimizer.md",
            "loop/interfaces/lr_scheduler.md",
        ] }
    ] },
    { "Model States" = [
        "model_states/io.md",
        "model_states/mapper.md",
    ] },
    { "Models" = [
        { "Model Catalogue" = [
            "models/model_catalogue/index.md",
            "models/model_catalogue/qwen3_moe.md",
            "models/model_catalogue/qwen3_dense.md"
        ] },
        { "Modules" = [
            "models/modules/index.md",
            "models/modules/embedding.md",
            "models/modules/head.md",
            "models/modules/attention.md",
            "models/modules/ffn.md",
            "models/modules/moe.md",
            "models/modules/positional.md",
            "models/modules/normalization.md",
            "models/modules/hidden_states_aggregator.md",
        ] },
        "models/model_design.md",
        "models/horizontal_parallelism.md",
        "models/pipeline_parallelism.md",
    ] },
    { "Datasets" = [
        "dataset/index.md"
    ] },
    { "Parameter-Efficient Fine-Tuning (PEFT)" = [
        "peft/overview.md",
        "peft/lora.md",
        "peft/full_tune.md",
        "peft/stack.md",
    ] },
    { "Metrics" = [
        "metric/overview.md",
        { "Metric Catalogue" = [
            "metric/metric_catalogue/index.md",
            "metric/metric_catalogue/aggregation.md",
            "metric/metric_catalogue/classification.md",
            "metric/metric_catalogue/container.md",
        ] },
        "metric/custom.md",
    ] },
    { "Experiment Tracking" = [
        "tracker/index.md",
    ] },
    { "Optimizers" = [
        "optimizer/stochastic.md",
    ] },
    { "Learning Rate Schedulers" = [
        "lr_scheduler/piecewise.md",
        "lr_scheduler/visualization.md",
    ] },
    { "Internals" = [
        "core/autograd_extensions.md",
        "internals/determinism.md",
        "internals/grad_norm.md",
        "internals/grad_sync.md",
        "internals/metric_collector.md",
        "internals/pipelining.md",
        "internals/profiling.md",
    ] },
]


[project.theme]
favicon = "https://avatars.githubusercontent.com/u/248787421"
logo = "https://avatars.githubusercontent.com/u/248787421"
language = "en"
features = [
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "deep purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "deep purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.plugins.mkdocstrings.handlers.python]
inventories = [
    "https://docs.python.org/3/objects.inv",
    "https://docs.pydantic.dev/latest/objects.inv",
    "https://docs.pytorch.org/docs/stable/objects.inv",
]
# paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
inherited_members = true
show_root_heading = true
show_root_full_path = true
show_symbol_type_heading = true
show_symbol_type_toc = true
show_source = false
heading_level = 3

[project.markdown_extensions.pymdownx.highlight]
linenums = true
anchor_linenums = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }]

# Includes example files into the pages, so the docs show the code that runs.
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/sNRjDbxVrg"
